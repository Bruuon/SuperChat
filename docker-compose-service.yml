
version: '3.8'
services:
  aiservice:
    container_name: AiService
    build:
      context: ./AiService
      dockerfile: Dockerfile
    ports:
      - "8105:8105"
    environment:
      # 给 JVM 加上堆大小，512M 容器默认堆只有 ~128M，AI 服务容易 OOM
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai -Xms256m -Xmx768m -XX:+HeapDumpOnOutOfMemoryError
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ai_docs:/data/docs          # 命名卷，路径对齐 yml，且可写（insert 接口要写）
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 容器内访问宿主机上的 mysql/redis/nacos/pgvector
    healthcheck:                    # 可选：你 Dockerfile 装了 curl 就是为这个
      test: ["CMD", "curl", "-f", "http://localhost:8105/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1024M             # 从 512M 提到 1024M，AI/RAG 服务别太抠
        reservations:
          memory: 512M

  gateway:
    container_name: GateWay
    build:
      context: ./GateWay
      dockerfile: Dockerfile
    ports:
      - "10010:10010"
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  offlinedataservice:
    container_name: OfflineDataService
    build:
      context: ./OfflineDataService
      dockerfile: Dockerfile
    ports:
      - "8101:8101"
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  realtimeservice:
    container_name: RealTimeService
    build:
      context: ./RealTimeService
      dockerfile: Dockerfile
    ports:
      - "8102:8102"
      - "9101:9101"
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  redpacketservice:
    container_name: RedPacketService
    build:
      context: ./RedPacketService
      dockerfile: Dockerfile
    ports:
      - "8103:8103"
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  userservice:
    container_name: UserService
    build:
      context: ./UserService
      dockerfile: Dockerfile
    ports:
      - "8104:8104"
    environment:
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

volumes:
  ai_docs: